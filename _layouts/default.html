<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo %}
  </head>

  <body>
    <div class="wrapper">
      <header>
        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" style="width:130px;height:130px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 1.2rem;" />
        {% endif %}

        <h1><a href="{{ "/" | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>

        <p>{{ site.description }}</p>

        <p style="margin-top:1rem;">
          <a href="https://www.linkedin.com/in/michael-kostan-81927a59" style="margin-right:0.8rem;">LinkedIn</a>
          <a href="mailto:michael@kostan.co.nz">Email</a>
        </p>
      </header>

      <section>
        {{ content }}
      </section>
    </div>

    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
